
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Everbliss Events</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-light site-nav">
        <div class="container">
            <a class="navbar-brand brand" href="index.html">
                everbliss<span>events</span>
            </a>
            <a class="text-link" href="index.html">← Back to home</a>
        </div>
    </nav>

    <main class="login-wrap section-pad">
        <div class="container">
            <div class="login-card mx-auto">

                <p class="eyebrow text-center">WELCOME BACK</p>
                <h1 class="text-center">Sign in to <em>Everbliss</em></h1>
                
                <form id="loginForm" class="needs-validation mt-4" novalidate>

                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email address</label>
                        <input
                            class="form-control"
                            id="loginEmail"
                            type="email"
                            required
                            placeholder="Enter your email Id"
                        >
                        <div class="invalid-feedback">Enter a valid email.</div>
                    </div>

                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input
                            class="form-control"
                            id="loginPassword"
                            type="password"
                            required
                            placeholder="Enter your password"
                        >
                        <div class="invalid-feedback">Enter your password.</div>
                    </div>

                    <div id="loginStatus" role="status" aria-live="polite"></div>

                    <button class="btn btn-brand w-100 mt-2" type="submit">
                        Sign in
                    </button>
                    
                    <p class="text-center muted mt-4 mb-0">
                        New to Everbliss?
                        <a href="register.html" class="signin-link">Create an account</a>
                    </p>


                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-bottom">
            © 2026 Everbliss Events 
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
